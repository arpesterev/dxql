name: Concurrency regression tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dxql_test
          POSTGRES_USER: dxql_test
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dxql_test -d dxql_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DXQL_TEST_PG_URL: jdbc:postgresql://localhost:5432/dxql_test
      DXQL_TEST_PG_USER: dxql_test
      DXQL_TEST_PG_PASSWORD: local_test_only
    steps:
      - uses: actions/checkout@v4
        with:
          path: dxql
      - uses: actions/checkout@v4
        with:
          repository: arpesterev/metan
          ref: 00de963808d0d8ef910861bf054de269900181a6
          path: metan
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gradle tests with public metan composite build
        working-directory: dxql
        run: gradle -PuseLocalMetan=true test --no-daemon
